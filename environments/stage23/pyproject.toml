[project]
name = "veriserve-research-environment"
version = "0.1.0"
description = "The independently pinned, validated stage-two/three environment"
requires-python = ">=3.12,<3.13"
dependencies = [
    "torch==2.8.0+cu128",
    "transformers==4.57.3",
    "datasets==4.8.5",
    "huggingface-hub==0.36.2",
    "numpy==2.3.2",
    "scipy==1.18.1",
    "scikit-learn==1.9.1",
    "math-verify[antlr4_13_2]==0.9.0",
    "antlr4-python3-runtime==4.13.2",
    "latex2sympy2-extended==1.11.0",
    "bitsandbytes==0.50.2",
    "accelerate==1.15.0",
    "matplotlib==3.10.5",
    "pyyaml==6.0.2",
    "psutil==7.0.0",
    "safetensors==0.8.0",
    "threadpoolctl==3.7.0",
]

[dependency-groups]
dev = ["pytest>=9,<10"]

[tool.uv]
package = false

[tool.uv.sources]
torch = { index = "pytorch-cu128" }

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true
